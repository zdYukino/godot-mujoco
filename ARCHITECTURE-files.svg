<text x="70" y="770" class="head">支持文件 · 已跟踪</text>
<text x="70" y="804" class="body">scripts/：构建、环境、二进制检查</text>
<text x="70" y="833" class="body">src/mobile_core_smoke.cpp：独立核心测试</text>
<text x="70" y="862" class="body">.github/workflows/：CI / 上游版本检查</text>
