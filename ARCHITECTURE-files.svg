<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1070" viewBox="0 0 1440 1070" role="img" aria-labelledby="title desc"><title id="title">02  仓库文件：从源码到可加载项目</title><desc id="desc">蓝：跟踪的源码/配置；绿：下载或构建生成；橙：Godot 项目入口。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#52647b"/></marker></defs><style>text{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#192b43}.title{font-size:32px;font-weight:700}.sub{font-size:18px;fill:#52647b}.head{font-size:22px;font-weight:700}.body{font-size:19px}.small{font-size:17px;fill:#52647b}</style><rect width="1440" height="1070" fill="#f5f7fb"/>
<text x="48" y="60" class="title">02  仓库文件：从源码到可加载项目</text>
<text x="48" y="97" class="sub">蓝：跟踪的源码/配置；绿：下载或构建生成；橙：Godot 项目入口。</text>
