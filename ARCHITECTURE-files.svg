<text x="70" y="370" class="head">演示项目 · demo/</text>
<text x="70" y="404" class="body">project.godot：60 Hz / Main.tscn</text>
<text x="70" y="433" class="body">*.tscn + scripts/*.gd：场景、控制、测试</text>
<text x="70" y="462" class="body">models/*.xml + composite/：MJCF 与资源</text>
<rect x="782" y="335" width="610" height="145" rx="14" fill="#e4f3ed" stroke="#c2cee0"/>
<text x="804" y="370" class="head">demo/addons/godot_mujoco/bin/</text>
<text x="804" y="404" class="body">libgodot_mujoco.linux.template_debug.</text>
<text x="804" y="433" class="body">x86_64.so  +  libmujoco.so.3.12.0</text>
<text x="804" y="462" class="body">生成物被 .gitignore 排除；.gitkeep 被跟踪</text>
<polyline points="1087,285 1087,335" fill="none" stroke="#52647b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="1110" y="314" class="small">编译 / 链接 / 拷贝</text>
<rect x="48" y="535" width="610" height="145" rx="14" fill="#e8efff" stroke="#c2cee0"/>
<text x="70" y="570" class="head">扩展配置与可视辅助</text>
<text x="70" y="604" class="body">godot_mujoco.gdextension：入口 + 库映射</text>
