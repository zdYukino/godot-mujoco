<rect x="782" y="735" width="610" height="175" rx="14" fill="#e4f3ed" stroke="#c2cee0"/>
<text x="804" y="770" class="head">运行与缓存 · 本地生成</text>
<text x="804" y="804" class="body">Godot 加载 demo/ 项目与扩展</text>
<text x="804" y="833" class="body">Linux RUNPATH=$ORIGIN → 同目录 MuJoCo</text>
<text x="804" y="862" class="body">demo/.godot/：导入与编辑器缓存</text>
<text x="804" y="891" class="body">build/：中间文件；二者均被忽略</text>
<polyline points="1087,605 1087,735" fill="none" stroke="#52647b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="48" y="965" class="body">Godot 可执行文件、GodotSharp、.NET SDK 均在仓库外；架构文档不附带这些二进制。</text>
