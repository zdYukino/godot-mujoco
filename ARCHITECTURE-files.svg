<text x="70" y="175" class="head">CMakeLists.txt + cmake/</text>
<text x="70" y="209" class="body">依赖版本 / 校验 / 编译 / 链接 / 拷贝</text>
<text x="70" y="238" class="body">src/register_types.cpp：入口与注册</text>
<text x="70" y="267" class="body">src/mj_world.cpp：MuJoCo 的 Node 封装</text>
<rect x="782" y="140" width="610" height="145" rx="14" fill="#e4f3ed" stroke="#c2cee0"/>
<text x="804" y="175" class="head">build/_deps/ · 本地依赖</text>
<text x="804" y="209" class="body">godot-cpp：godot-4.5-stable</text>
<text x="804" y="238" class="body">MuJoCo 3.12.0：本次使用官方预编译包</text>
<text x="804" y="267" class="body">移动平台默认从源码构建 MuJoCo 核心</text>
<polyline points="658,210 782,210" fill="none" stroke="#52647b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="676" y="194" class="small">获取依赖</text>
