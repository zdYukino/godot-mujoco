<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1070" viewBox="0 0 1440 1070" role="img" aria-labelledby="title desc"><title id="title">01  Godot 本体：安装文件与责任分层</title><desc id="desc">左：本次实测的发行包；右：官方文档对应的概念层，不是本地引擎源码审阅。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#52647b"/></marker></defs><style>text{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#192b43}.title{font-size:32px;font-weight:700}.sub{font-size:18px;fill:#52647b}.head{font-size:22px;font-weight:700}.body{font-size:19px}.small{font-size:17px;fill:#52647b}</style><rect width="1440" height="1070" fill="#f5f7fb"/>
<text x="48" y="60" class="title">01  Godot 本体：安装文件与责任分层</text>
<text x="48" y="97" class="sub">左：本次实测的发行包；右：官方文档对应的概念层，不是本地引擎源码审阅。</text>
<rect x="48" y="135" width="590" height="150" rx="14" fill="#e4f3ed" stroke="#c2cee0"/>
<text x="70" y="170" class="head">实际安装 · 仓库外</text>
<text x="70" y="204" class="body">bin/godot → env.sh → 引擎可执行文件</text>
<text x="70" y="233" class="body">Godot 4.7.2 .NET · Linux x86_64</text>
<text x="70" y="262" class="body">单独安装 .NET SDK 8.0.426</text>
<rect x="48" y="325" width="590" height="150" rx="14" fill="#e4f3ed" stroke="#c2cee0"/>
<text x="70" y="360" class="head">Godot 发行包目录</text>
<text x="70" y="394" class="body">Godot_v4.7.2-stable_mono_linux.x86_64</text>
<text x="70" y="423" class="body">GodotSharp/Api/{Debug,Release}/</text>
<text x="70" y="452" class="body">GodotSharp/Tools/</text>
<polyline points="343,285 343,325" fill="none" stroke="#52647b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="48" y="520" width="590" height="175" rx="14" fill="#fff2db" stroke="#c2cee0"/>
<text x="70" y="555" class="head">项目文件 · godot-mujoco/demo/</text>
<text x="70" y="589" class="body">project.godot → Main.tscn → scripts/*.gd</text>
<text x="70" y="618" class="body">addons/godot_mujoco/*.gdextension</text>
<text x="70" y="647" class="body">bin/ 中的扩展库 + MuJoCo 运行库</text>
<text x="70" y="676" class="body">res:// 指向 demo/，不指向仓库根</text>
<polyline points="343,475 343,520" fill="none" stroke="#52647b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="735" y="135" width="657" height="140" rx="14" fill="#e8efff" stroke="#c2cee0"/>
<text x="757" y="170" class="head">场景与语言层</text>
<text x="757" y="204" class="body">scene/：SceneTree、Node、Node3D、UI</text>
<text x="757" y="233" class="body">modules/：GDScript / .NET 支持</text>
<text x="757" y="262" class="body">editor/：编辑器、Inspector、导入</text>
<rect x="735" y="320" width="657" height="140" rx="14" fill="#e8efff" stroke="#c2cee0"/>
<text x="757" y="355" class="head">引擎服务层</text>
<text x="757" y="389" class="body">servers/：RenderingServer、PhysicsServer 等</text>
<text x="757" y="418" class="body">本项目：Godot 渲染 + MuJoCo 自己的物理</text>
<text x="757" y="447" class="body">MuJoCo 不替换 Godot PhysicsServer</text>
<polyline points="1063,275 1063,320" fill="none" stroke="#52647b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="735" y="505" width="657" height="115" rx="14" fill="#e8efff" stroke="#c2cee0"/>
<text x="757" y="540" class="head">平台与后端</text>
<text x="757" y="574" class="body">drivers/ + platform/</text>
<text x="757" y="603" class="body">图形/音频等后端、操作系统接口</text>
<polyline points="1063,460 1063,505" fill="none" stroke="#52647b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="735" y="665" width="657" height="115" rx="14" fill="#e8efff" stroke="#c2cee0"/>
<text x="757" y="700" class="head">跨层公共基础</text>
<text x="757" y="734" class="body">core/：Object、ClassDB、Variant、文件与数学</text>
<text x="757" y="763" class="body">main/：启动与主循环</text>
<rect x="48" y="825" width="1344" height="165" rx="14" fill="#e4f3ed" stroke="#c2cee0"/>
<text x="70" y="860" class="head">本项目插入点：GDExtension → ClassDB → MjWorld : Node</text>
<text x="70" y="894" class="body">运行时加载原生扩展，无需把 MuJoCo 编入 Godot 本体。</text>
<text x="70" y="923" class="body">godot-cpp 固定 godot-4.5-stable：它是 C++ 绑定，不是引擎源码。</text>
<text x="70" y="952" class="body">当前演示为 GDScript；C# 动态调用已实测，仓库尚无类型化 C# 包装。</text>
<text x="48" y="1045" class="small">2026-10-16 · 源码基线 e8b6443 · 详细依据、坐标与测试限制见 ARCHITECTURE.zh-CN.md</text>
</svg>